<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule &amp; Events | Christians in Seattle at UW</title>
  <meta name="description" content="Upcoming and past student events for Christians in Seattle at UW.">
  <meta property="og:title" content="Events | Christians in Seattle at UW">
  <meta property="og:description" content="Bible reading, fellowship, welcome events, and student activities at UW.">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/branding/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/site.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <header class="page-hero">
      <div class="shell">
        <p class="eyebrow">Fall 2026</p>
        <h1 data-i18n="pages.eventsTitle">Schedule &amp; Events</h1>
        <p data-i18n="pages.eventsIntro">Our weekly rhythm, plus photos from past gatherings.</p>
      </div>
    </header>
    <section class="section section-dark">
      <div class="shell">
        <div class="section-heading-row">
          <div class="section-heading"><h2 data-i18n="home.featured">Our Weekly Rhythm</h2></div>
          <div class="schedule-actions">
            <a class="button button-primary" href="#" data-google-calendar-all data-social-preview="calendar" data-i18n="common.addAll">Add all to Google Calendar</a>
          </div>
        </div>
        <div id="upcoming-events" class="schedule-grid" aria-live="polite"></div>
        <div class="notice" data-i18n="common.latestNotice">Meeting rooms and event details may change. Please check Instagram, Discord, or the latest event listing before attending.</div>
      </div>
    </section>
    <section class="section section-white">
      <div class="shell">
        <div class="section-heading"><h2 data-i18n="pages.past">Past Events</h2></div>
        <div id="past-events" class="schedule-grid" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script type="module">
    import { pastEvents } from "./data/events.js";
    import { splitEvents, renderSchedule, renderUpcoming } from "./js/schedule.js";
    import { getLanguage } from "./js/i18n.js";
    function render() {
      const groups = splitEvents();
      renderUpcoming(document.querySelector("#upcoming-events"), groups.upcoming);
      const past = document.querySelector("#past-events");
      const allPast = [...groups.past, ...groups.cancelled, ...pastEvents].sort((a, b) => b.date.localeCompare(a.date));
      if (allPast.length) {
        renderSchedule(past, allPast);
      } else {
        past.innerHTML = "<p class=\"empty-state\">" + (getLanguage() === "zh" ? "目前没有过往活动记录。" : "No past events are listed yet.") + "</p>";
      }
    }
    render();
    window.addEventListener("languagechange", render);
  </script>
</body>
</html>
