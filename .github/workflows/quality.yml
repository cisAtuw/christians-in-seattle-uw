name: Quality checks

# CI for the site: every pull request and every push to main or staging is checked before it
# can go live. Two gates, both must pass:
#   1. axe-core: 0 accessibility violations on 10 pages x English/Chinese x phone/desktop
#   2. Lighthouse CI: Accessibility and SEO score 100 on every public page (mobile profile)
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 0.5; done
      - name: Accessibility (axe-core, 40 page checks)
        run: npm run test:a11y
      - name: Lighthouse CI (Accessibility and SEO = 100)
        run: |
          export CHROME_PATH="$(node -e "import('playwright').then(p => console.log(p.chromium.executablePath()))")"
          npx lhci autorun
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports
          if-no-files-found: ignore
