name: Sync weekly schedule from Google Calendar

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build schedule from the public calendar
        run: node scripts/sync-calendar.mjs
      - name: Commit and redeploy if the schedule changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/weekly-schedule.js)" ]; then
            git config user.name "cisAtuw"
            git config user.email "cisAtuw@users.noreply.github.com"
            git add data/weekly-schedule.js
            git commit -m "Sync weekly schedule from Google Calendar"
            git push
            gh workflow run static.yml --ref main
          fi
